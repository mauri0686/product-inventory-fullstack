services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: product_inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d product_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - product_inventory_data:/var/lib/postgresql/data

volumes:
  product_inventory_data:
